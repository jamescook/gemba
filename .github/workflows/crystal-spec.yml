name: crystal spec (docker)

# Self-hosted only, gated to jamescook: this repo is public, and a
# self-hosted runner executes workflow code directly on that machine, so
# a future collaborator with write access must not be able to trigger a
# run here even via workflow_dispatch. Manual trigger only (no
# push/pull_request) - see the runner setup notes for how to start it.
#
# No Docker layer-cache plumbing here (unlike a GitHub-hosted runner):
# this machine's Docker daemon persists between runs, so ordinary layer
# caching already covers what actions/cache + buildkit-cache-dance +
# type=gha existed to work around on ephemeral hosted runners.
on:
  workflow_dispatch:

jobs:
  spec:
    runs-on: [self-hosted, macOS, jamescook-local]
    if: github.actor == 'jamescook'
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gemba-test:latest -f Dockerfile .

      - name: Run crystal spec
        run: docker run --rm --init -t gemba-test:latest
