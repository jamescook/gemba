name: crystal spec (docker)

# Manual only - no `on: push`/`on: pull_request`. This Dockerfile builds
# libmgba and rcheevos from source (~2-3 minutes) on top of a fresh
# Crystal toolchain pull, then runs the full suite under Xvfb - too slow
# to burn Actions minutes on every push/PR for a single-maintainer,
# pre-release repo. Trigger it by hand from the Actions tab (or
# `gh workflow run crystal-spec.yml`) when you want the Linux/Xvfb lane
# checked. Mirrors crystal-teek's own .github/workflows/crystal-spec.yml.
on:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile's own apt-get RUN uses --mount=type=cache, which
      # BuildKit keeps in the local daemon's cache - gone by default on
      # the next run, since GitHub Actions runners are ephemeral. This
      # restores/saves that cache mount via actions/cache instead, the
      # same pattern crystal-teek's own workflow uses - a rerun doesn't
      # re-download this Dockerfile's (large) apt package list from
      # scratch every time.
      - name: Restore apt build cache
        uses: actions/cache@v4
        with:
          path: cache-mount
          key: docker-cache-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            docker-cache-

      - name: Inject/extract Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cache-mount/var-cache-apt": "/var/cache/apt",
              "cache-mount/var-lib-apt": "/var/lib/apt"
            }
          builder: ${{ steps.buildx.outputs.name }}

      # cache-from/cache-to: type=gha additionally caches the built
      # image's own layers (not just apt's package cache) via GitHub's
      # Actions cache backend - so an unchanged Dockerfile skips the
      # libmgba/rcheevos build layers entirely instead of redoing them
      # on every run.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          tags: gemba-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run crystal spec
        run: docker run --rm --init -t gemba-test:latest
