name: gemba
version: 0.1.0

authors:
  - James Cook

crystal: ">= 1.21.0"

license: MIT

description: |
  GBA emulator frontend - a Crystal/Tryst port of the ruby gemba app
  (teek + libmgba).

# tryst, tryst-sdl, and the settings UI's tryst-switch/tryst-segmented/
# tryst-value-slider are all independent repos - plain github:
# dependencies, no monorepo path or submodule needed.
dependencies:
  tryst:
    github: jamescook/tryst
  tryst-sdl:
    github: jamescook/tryst-sdl
  tryst-switch:
    github: jamescook/tryst-switch
  tryst-segmented:
    github: jamescook/tryst-segmented
  tryst-value-slider:
    github: jamescook/tryst-value-slider

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    tag: v1.7.0

# Informational (shards does not install these). tryst-sdl's own
# shard.yml lists the SDL3 package names this shard also needs (it
# renders through tryst-sdl). libmgba is a native dependency built
# separately (see the Dockerfile), not something shards installs either.
libraries:
  libSDL3: ">= 3.2.0"
  libSDL3_mixer: ">= 3.2.0"
  libSDL3_image: ">= 3.2.0"
  libSDL3_ttf: ">= 3.2.0"

# Gemba is the one shard in this monorepo meant to be an actual runnable
# app, not a library other shards depend on - `shards build` (or `crystal
# build src/gemba_app.cr -o bin/gemba`) produces the real thing, unlike
# every sibling widget shard's examples/ (typechecked demos, never run
# via a shard target).
targets:
  gemba:
    main: src/gemba_app.cr
